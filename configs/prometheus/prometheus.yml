# Prometheus Configuration for Mini-SOC

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'minisoc'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mini-SOC Exporter
  - job_name: 'minisoc-exporter'
    static_configs:
      - targets: ['exporter:9100']
        labels:
          service: 'minisoc-metrics'

  # Node Exporter (if installed on host)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.1.70:9100']
        labels:
          instance: 'security-box'
